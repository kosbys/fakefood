[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
serde = "1.0.229"
sqlx = {version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "migrate", "chrono"]}
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
